<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 8px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: #333;
            border: 2px solid #555;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .cell:hover {
            background: #444;
            transform: scale(1.03);
        }

        .x {
            color: #4fc3f7;
        }

        .o {
            color: #ff8a65;
        }

        #status {
            margin-top: 20px;
            font-size: 20px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #4fc3f7;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1>Tic Tac Toe</h1>

    <div class="board" id="board">
        <div class="cell" onclick="play(0)"></div>
        <div class="cell" onclick="play(1)"></div>
        <div class="cell" onclick="play(2)"></div>
        <div class="cell" onclick="play(3)"></div>
        <div class="cell" onclick="play(4)"></div>
        <div class="cell" onclick="play(5)"></div>
        <div class="cell" onclick="play(6)"></div>
        <div class="cell" onclick="play(7)"></div>
        <div class="cell" onclick="play(8)"></div>
    </div>

    <div id="status">Giliran: X</div>

    <button onclick="resetGame()">Reset Game</button>

    <script>
        let board = Array(9).fill("");
        let currentPlayer = "X";
        let gameOver = false;

        const cells = document.querySelectorAll(".cell");
        const statusText = document.getElementById("status");

        const winPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function play(index) {
            if (board[index] !== "" || gameOver) {
                return;
            }

            board[index] = currentPlayer;
            cells[index].innerText = currentPlayer;
            cells[index].classList.add(currentPlayer.toLowerCase());

            if (checkWinner()) {
                statusText.innerText = `Pemain ${currentPlayer} Menang!`;
                gameOver = true;
                return;
            }

            if (!board.includes("")) {
                statusText.innerText = "Permainan Seri!";
                gameOver = true;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusText.innerText = `Giliran: ${currentPlayer}`;
        }

        function checkWinner() {
            return winPatterns.some(pattern => {
                return pattern.every(index => {
                    return board[index] === currentPlayer;
                });
            });
        }

        function resetGame() {
            board = Array(9).fill("");
            currentPlayer = "X";
            gameOver = false;

            cells.forEach(cell => {
                cell.innerText = "";
                cell.classList.remove("x", "o");
            });

            statusText.innerText = "Giliran: X";
        }
    </script>

</body>
</html>
